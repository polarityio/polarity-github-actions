name: Release Integration

on:
  workflow_call:
    inputs:
      node-build-version:
        description: 'The Node version used for v2 npm run build'
        required: false
        type: string
        default: '24'
      os-version:
        description: 'The OS version for the build runner'
        required: false
        type: string
        default: ubuntu-latest
      use-integration-development-checklist:
        description: 'A flag to disable the integration development checklist requirement to create a release'
        required: false
        type: boolean
        default: true
      har-publish-enabled:
        description: >-
          Publish recorded HAR fixtures (mocks/**/*.har) to S3 on release (INT-2194).
          Off by default: OIDC needs `permissions: id-token: write` in the caller
          job, so this is enabled per-repo via the integration template as that
          permission is rolled out. Flip the default to true once every caller has it.
        required: false
        type: boolean
        default: false
      har-bucket:
        description: 'S3 bucket for HAR fixtures (INT-2192).'
        required: false
        type: string
        default: polarity-har-fixtures-test
      har-publish-role-arn:
        description: 'IAM role assumed via GitHub OIDC to publish fixtures (INT-2192).'
        required: false
        type: string
        default: arn:aws:iam::623071050687:role/har-fixtures-publish
      har-aws-region:
        description: 'AWS region for the HAR fixtures bucket.'
        required: false
        type: string
        default: us-east-1

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      is_v2: ${{ steps.check-config.outputs.is_v2 }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for runtimeVersion in config
        id: check-config
        run: |
          CONFIG_FILE="config/config.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "is_v2=false" >> $GITHUB_OUTPUT
            echo "No config/config.json found — using v1 workflow."
            exit 0
          fi

          RUNTIME_VERSION=$(node -p "try { const c = require('./$CONFIG_FILE'); c.runtimeVersion ?? 'undefined' } catch(e) { 'undefined' }" 2>/dev/null || echo "undefined")

          if [ "$RUNTIME_VERSION" = "2" ]; then
            echo "is_v2=true" >> $GITHUB_OUTPUT
            echo "runtimeVersion is 2 — using v2 workflow."
          else
            echo "is_v2=false" >> $GITHUB_OUTPUT
            echo "runtimeVersion is '$RUNTIME_VERSION' — using v1 workflow."
          fi

  # ──────────────────────────────────────────────
  # V1 Build & Release
  # ──────────────────────────────────────────────

  v1-build:
    needs: detect-version
    if: needs.detect-version.outputs.is_v2 == 'false'
    runs-on: ${{ inputs.os-version }}
    strategy:
      matrix:
        node-version: ["18", "24"]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get NPM Version
        id: package-version
        run: echo "current-version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Create Build
        id: create-build
        run: |
          npm ci --omit=dev --no-bin-links &&
          cd .. && 
          tar -h --exclude="./${{ github.event.repository.name }}/.git" --exclude="./${{ github.event.repository.name }}/.gitignore" --exclude="./${{ github.event.repository.name }}/.github" --exclude="devRunnerResults.json" -czvf "${{ github.event.repository.name }}-${{ steps.package-version.outputs.current-version }}+node-${{ matrix.node-version }}.tgz" "./${{ github.event.repository.name }}" &&
          echo "buildHash=$(sha256sum '${{ github.event.repository.name }}-${{ steps.package-version.outputs.current-version }}+node-${{ matrix.node-version }}.tgz' | grep -oE '^[^ ]*' )" >> $GITHUB_ENV &&
          mv "${{ github.event.repository.name }}-${{ steps.package-version.outputs.current-version }}+node-${{ matrix.node-version }}.tgz" ${{ github.event.repository.name }} &&
          cd ${{ github.event.repository.name }}
      - name: Adding SHA256 Hash For Release
        run: |
          echo "${{ env.buildHash }}" > ReleaseSHA256Hash.txt
      - name: Upload ReleaseSHA256Hash
        uses: actions/upload-artifact@v6
        with:
          name: ReleaseSHA256Hash-v1-node${{ matrix.node-version }}
          path: ReleaseSHA256Hash.txt
      - name: Upload ReleaseArchive
        uses: actions/upload-artifact@v6
        with:
          name: ReleaseArchive-v1-node${{ matrix.node-version }}
          path: ${{ github.event.repository.name }}-${{ steps.package-version.outputs.current-version }}+node-${{ matrix.node-version }}.tgz

  v1-release:
    runs-on: ubuntu-latest
    needs: [detect-version, v1-build]
    if: needs.detect-version.outputs.is_v2 == 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: '0'
      - uses: actions/setup-node@v5
      - name: Get NPM Version
        id: package-version
        run: echo "current-version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Download Node18 SHA256Hash
        uses: actions/download-artifact@v6
        with:
          name: ReleaseSHA256Hash-v1-node18
          path: hashes/node18
      - name: Download Node24 SHA256Hash
        uses: actions/download-artifact@v6
        with:
          name: ReleaseSHA256Hash-v1-node24
          path: hashes/node24
      - name: Download Node18 ReleaseArchive
        uses: actions/download-artifact@v6
        with:
          name: ReleaseArchive-v1-node18
      - name: Download Node24 ReleaseArchive
        uses: actions/download-artifact@v6
        with:
          name: ReleaseArchive-v1-node24
      - name: Add SHA256 Hashes to ENV
        run: |
          echo "ReleaseSHA256Hash_node18=$(cat hashes/node18/ReleaseSHA256Hash.txt)" >> $GITHUB_ENV
          echo "ReleaseSHA256Hash_node24=$(cat hashes/node24/ReleaseSHA256Hash.txt)" >> $GITHUB_ENV
      - name: Getting Git Commit Logs Since Last Release
        run: |
          echo "$(git log $(git tag -l | cat | tail -1)..HEAD --oneline | cat | awk '{$1="-"; print $0}')" > commitLogs.txt
      - name: Add commitLogs to ENV for use
        run: |
          commitLogs=$(cat commitLogs.txt)
          echo "commitLogs<<EOF" >> $GITHUB_ENV
          echo "$commitLogs" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Create Versioned Release
        id: create-versioned-release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.package-version.outputs.current-version }}
          tag_name: ${{ steps.package-version.outputs.current-version }}
          body: |
            ## Release Notes
            ${{ env.commitLogs }}
            
            ## Downloads

            ---
           
            **Polarity Server 5.x Node18**
            - DOWNLOAD: [${{ github.event.repository.name }}-${{ steps.package-version.outputs.current-version }}+node-18.tgz](https://github.com/polarityio/${{ github.event.repository.name }}/releases/download/${{ steps.package-version.outputs.current-version }}/${{ github.event.repository.name }}-${{ steps.package-version.outputs.current-version }}+node-18.tgz)
            SHA256: ${{ env.ReleaseSHA256Hash_node18 }}

            ---

            **Polarity Server 5.x Node24**
            - DOWNLOAD: [${{ github.event.repository.name }}-${{ steps.package-version.outputs.current-version }}+node-24.tgz](https://github.com/polarityio/${{ github.event.repository.name }}/releases/download/${{ steps.package-version.outputs.current-version }}/${{ github.event.repository.name }}-${{ steps.package-version.outputs.current-version }}+node-24.tgz)
            SHA256: ${{ env.ReleaseSHA256Hash_node24 }}
          files: |
            ./${{ github.event.repository.name }}-${{ steps.package-version.outputs.current-version }}+node-18.tgz
            ./${{ github.event.repository.name }}-${{ steps.package-version.outputs.current-version }}+node-24.tgz
          draft: false
          prerelease: false
          make_latest: false
          generate_release_notes: false
          append_body: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # V2 Build & Release
  # ──────────────────────────────────────────────

  v2-build:
    needs: detect-version
    if: needs.detect-version.outputs.is_v2 == 'true'
    runs-on: ${{ inputs.os-version }}
    strategy:
      matrix:
        node-version: ["18", "24"]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Ensure LFS files are materialized (noop if lfs large file storage not used)
        run: git lfs pull
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get NPM Version
        id: package-version
        run: echo "current-version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: |
          npm ci
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-build-version }}
      - name: Build
        run: |
          npm run build
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Remove Dev Dependencies
        run: |
          npm prune --omit=dev
          rm -rf node_modules/.bin
      - name: Create Build Archive
        id: create-build
        run: |
          cd .. &&
          tar \
            -h \
            --exclude="./${{ github.event.repository.name }}/.git" \
            --exclude="./${{ github.event.repository.name }}/.gitignore" \
            --exclude="./${{ github.event.repository.name }}/.github" \
            --exclude="./${{ github.event.repository.name }}/eslint.config.mjs" \
            --exclude="./${{ github.event.repository.name }}/vitest.config.ts" \
            --exclude="./${{ github.event.repository.name }}/tsconfig.json" \
            --exclude="./${{ github.event.repository.name }}/tsconfig.web.json" \
            --exclude="./${{ github.event.repository.name }}/vite.config.js" \
            --exclude="./${{ github.event.repository.name }}/.prettierrc" \
            --exclude="./${{ github.event.repository.name }}/.prettierignore" \
            --exclude="./${{ github.event.repository.name }}/package-lock.json" \
            --exclude="*.js.map" \
            --exclude="*.d.ts" \
            --exclude="./${{ github.event.repository.name }}/src" \
            --exclude="./${{ github.event.repository.name }}/tests" \
            --exclude="./${{ github.event.repository.name }}/mocks" \
            --exclude="./${{ github.event.repository.name }}/docs" \
            --exclude="./${{ github.event.repository.name }}/README.md" \
            --exclude="devRunnerResults.json" \
            -czvf "${{ github.event.repository.name }}-v2-${{ steps.package-version.outputs.current-version }}+node-${{ matrix.node-version }}.tgz" "./${{ github.event.repository.name }}" &&
          echo "buildHash=$(sha256sum '${{ github.event.repository.name }}-v2-${{ steps.package-version.outputs.current-version }}+node-${{ matrix.node-version }}.tgz' | grep -oE '^[^ ]*' )" >> $GITHUB_ENV &&
          mv "${{ github.event.repository.name }}-v2-${{ steps.package-version.outputs.current-version }}+node-${{ matrix.node-version }}.tgz" ${{ github.event.repository.name }} &&
          cd ${{ github.event.repository.name }}
      - name: Adding SHA256 Hash For Release
        run: |
          echo "${{ env.buildHash }}" > ReleaseSHA256Hash.txt
      - name: Upload ReleaseSHA256Hash
        uses: actions/upload-artifact@v6
        with:
          name: ReleaseSHA256Hash-v2-node${{ matrix.node-version }}
          path: ReleaseSHA256Hash.txt
      - name: Upload ReleaseArchive
        uses: actions/upload-artifact@v6
        with:
          name: ReleaseArchive-v2-node${{ matrix.node-version }}
          path: ${{ github.event.repository.name }}-v2-${{ steps.package-version.outputs.current-version }}+node-${{ matrix.node-version }}.tgz

  v2-release:
    runs-on: ubuntu-latest
    needs: [detect-version, v2-build]
    if: needs.detect-version.outputs.is_v2 == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: '0'
      - uses: actions/setup-node@v5
      - name: Get NPM Version
        id: package-version
        run: echo "current-version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Download Node18 SHA256Hash
        uses: actions/download-artifact@v6
        with:
          name: ReleaseSHA256Hash-v2-node18
          path: hashes/node18
      - name: Download Node24 SHA256Hash
        uses: actions/download-artifact@v6
        with:
          name: ReleaseSHA256Hash-v2-node24
          path: hashes/node24
      - name: Download Node18 ReleaseArchive
        uses: actions/download-artifact@v6
        with:
          name: ReleaseArchive-v2-node18
      - name: Download Node24 ReleaseArchive
        uses: actions/download-artifact@v6
        with:
          name: ReleaseArchive-v2-node24
      - name: Add SHA256 Hashes to ENV
        run: |
          echo "ReleaseSHA256Hash_node18=$(cat hashes/node18/ReleaseSHA256Hash.txt)" >> $GITHUB_ENV
          echo "ReleaseSHA256Hash_node24=$(cat hashes/node24/ReleaseSHA256Hash.txt)" >> $GITHUB_ENV
      - name: Getting Git Commit Logs Since Last Release
        run: |
          echo "$(git log $(git tag -l | cat | tail -1)..HEAD --oneline | cat | awk '{$1="-"; print $0}')" > commitLogs.txt
      - name: Add commitLogs to ENV for use
        run: |
          commitLogs=$(cat commitLogs.txt)
          echo "commitLogs<<EOF" >> $GITHUB_ENV
          echo "$commitLogs" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Create Versioned Release
        id: create-versioned-release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.package-version.outputs.current-version }}
          tag_name: ${{ steps.package-version.outputs.current-version }}
          body: |
            ## Release Notes
            ${{ env.commitLogs }}

            ## Downloads

            **Polarity Server 5.x (v2 framework) Node18**
            - DOWNLOAD: [${{ github.event.repository.name }}-v2-${{ steps.package-version.outputs.current-version }}+node-18.tgz](https://github.com/polarityio/${{ github.event.repository.name }}/releases/download/${{ steps.package-version.outputs.current-version }}/${{ github.event.repository.name }}-v2-${{ steps.package-version.outputs.current-version }}+node-18.tgz)
            SHA256: ${{ env.ReleaseSHA256Hash_node18 }}

            ---

            **Polarity Server 5.x (v2 framework) Node24**
            - DOWNLOAD: [${{ github.event.repository.name }}-v2-${{ steps.package-version.outputs.current-version }}+node-24.tgz](https://github.com/polarityio/${{ github.event.repository.name }}/releases/download/${{ steps.package-version.outputs.current-version }}/${{ github.event.repository.name }}-v2-${{ steps.package-version.outputs.current-version }}+node-24.tgz)
            SHA256: ${{ env.ReleaseSHA256Hash_node24 }}
          files: |
            ./${{ github.event.repository.name }}-v2-${{ steps.package-version.outputs.current-version }}+node-18.tgz
            ./${{ github.event.repository.name }}-v2-${{ steps.package-version.outputs.current-version }}+node-24.tgz
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          append_body: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Publish recorded HAR fixtures to S3 (INT-2194)
  # ──────────────────────────────────────────────
  # Runs for both v1 and v2 integrations. Independent of the build/release jobs.
  # Opt-in (har-publish-enabled): the caller job must also grant
  # `permissions: id-token: write` for the OIDC assume to work.
  publish-har-fixtures:
    if: ${{ inputs.har-publish-enabled }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # assume the publish role via GitHub OIDC
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Materialize LFS fixtures (noop if unused)
        run: git lfs pull || true
      - name: Detect HAR fixtures
        id: detect
        run: |
          shopt -s globstar nullglob
          files=(mocks/**/*.har)
          if [ ${#files[@]} -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found ${#files[@]} HAR fixture(s)."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No mocks/**/*.har — nothing to publish."
          fi
      - name: Sanitization gate
        if: steps.detect.outputs.found == 'true'
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const REDACTED = '[REDACTED]';
          const NAME_KEYS = new Set(['authorization', 'x-api-key', 'x-auth-token', 'cookie', 'set-cookie']);
          const NAME_SUBSTR = ['secret', 'token', 'password'];
          const QUERY_KEYS = new Set(['api_key', 'apikey', 'token', 'key', 'password', 'secret']);
          const sensitiveHeader = (n) => {
            const l = (n || '').toLowerCase();
            return NAME_KEYS.has(l) || NAME_SUBSTR.some((s) => l.includes(s));
          };
          const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
            const p = path.join(dir, e.name);
            return e.isDirectory() ? walk(p) : e.name.endsWith('.har') ? [p] : [];
          });
          const bad = [];
          for (const file of walk('mocks')) {
            let har;
            try { har = JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch { bad.push(`${file}: invalid JSON`); continue; }
            for (const entry of har?.log?.entries ?? []) {
              const headers = [...(entry.request?.headers ?? []), ...(entry.response?.headers ?? [])];
              for (const h of headers) {
                if (sensitiveHeader(h.name) && h.value !== REDACTED) bad.push(`${file}: header ${h.name}`);
              }
              for (const q of entry.request?.queryString ?? []) {
                if (QUERY_KEYS.has((q.name || '').toLowerCase()) && q.value !== REDACTED) bad.push(`${file}: query ${q.name}`);
              }
            }
          }
          if (bad.length) {
            console.error('::error::Unredacted auth material in HAR fixtures (re-record with the SDK --record-har):');
            for (const b of [...new Set(bad)]) console.error('  ' + b);
            process.exit(1);
          }
          console.log('Sanitization gate passed.');
          EOF
      - name: Configure AWS credentials (OIDC)
        if: steps.detect.outputs.found == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.har-publish-role-arn }}
          aws-region: ${{ inputs.har-aws-region }}
      - name: Publish fixtures to S3 (mirror-with-delete)
        if: steps.detect.outputs.found == 'true'
        run: |
          dest="s3://${{ inputs.har-bucket }}/${GITHUB_REPOSITORY#*/}/mocks"
          echo "Publishing $(find mocks -name '*.har' | wc -l) fixture(s) to $dest"
          aws s3 sync mocks "$dest" --delete --exclude "*" --include "*.har"
